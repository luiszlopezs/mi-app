name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Correr pruebas
        run: npm test
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t mi-app:${{ github.sha }} .

      - name: Probar el contenedor
        run: |
          docker run -d --name app -p 3000:3000 \
            -e APP_VERSION=${{ github.sha }} mi-app:${{ github.sha }}
          sleep 5
          curl --fail http://localhost:3000/health

      - name: Mostrar logs si falló
        if: failure()
        run: docker logs app